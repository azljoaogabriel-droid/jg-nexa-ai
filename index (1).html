<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JG Nexa AI</title>
<style>
body {
  margin: 0;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  min-height: 100vh;
}
.app {
  width: 90%;
  max-width: 700px;
  background: #151d32;
  border-radius: 18px;
  overflow: hidden;
}
header {
  background: linear-gradient(135deg,#1769ff,#773cff);
  padding: 22px;
}
header h1 { margin: 0; }
#chat {
  height: 350px;
  overflow-y: auto;
  padding: 18px;
}
.msg {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.ia { background: #263451; }
.user { background: #245eea; text-align: right; }
form { display: flex; gap: 8px; padding: 15px; }
input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border-radius: 8px;
}
button {
  padding: 12px;
  background: #3976ff;
  color: white;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}
#status { padding: 0 15px 12px; color: #b8c7e6; }
</style>
</head>
<body>
<div class="app">
<header>
<h1>🤖 JG Nexa AI</h1>
<p>O futuro começa com uma ideia.</p>
</header>
<div id="chat" aria-live="polite">
<div class="msg ia">Olá! Sou a JG Nexa AI. Como posso ajudar?</div>
</div>
<div id="status">Interface pronta!</div>
<form id="form">
<input id="pergunta" placeholder="Digite sua pergunta..." required>
<button id="botao">Enviar</button>
</form>
</div>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const pergunta = document.getElementById('pergunta');
const status = document.getElementById('status');
const botao = document.getElementById('botao');

function mensagem(texto, tipo) {
  const div = document.createElement('div');
  div.className = 'msg ' + tipo;
  div.textContent = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const texto = pergunta.value.trim();
  if (!texto) return;

  mensagem(texto, 'user');
  pergunta.value = '';
  botao.disabled = true;
  status.textContent = 'A JG Nexa está pensando...';

  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: texto})
    });
    if (!r.ok) throw new Error('Servidor indisponível');
    const dados = await r.json();
    mensagem(dados.reply, 'ia');
    status.textContent = 'Pronta para conversar!';
  } catch {
    mensagem(
      'Ainda falta conectar o servidor de inteligência artificial.',
      'ia'
    );
    status.textContent = 'Servidor não conectado.';
  } finally {
    botao.disabled = false;
    pergunta.focus();
  }
});
</script>
</body>
</html>
